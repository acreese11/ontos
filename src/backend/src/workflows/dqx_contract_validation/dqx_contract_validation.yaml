name: "DQX Contract Validation"
description: "Reference federated quality pipeline (notebook): pull contract from Ontos, run DQX-native checks, separate errors vs warnings, write quarantine, post metrics back. Runs as a notebook so the execution is visible step-by-step."
format: "MULTI_TASK"

# Runs on serverless compute (no cluster declared → jobs_manager omits cluster params).
# Dependencies are installed by the notebook's first %pip cell so the run is self-contained
# and the DQX version is visible on screen.

tasks:
  - task_key: "dqx_contract_validation"
    notebook_task:
      # Resolved by jobs_manager to the deployed workspace notebook path (no extension).
      notebook_path: "dqx_contract_validation"
      base_parameters:
        contract_id: "{{job.parameters.contract_id}}"
        ontos_base_url: "{{job.parameters.ontos_base_url}}"
        pipeline_id: "{{job.parameters.pipeline_id}}"
        write_quarantine: "{{job.parameters.write_quarantine}}"
        # Run-As auth (default): the job exchanges its own identity for an app-audience
        # token; app_client_id is the audience. The SP-secret fields are the fallback.
        auth_mode: "{{job.parameters.auth_mode}}"
        app_client_id: "{{job.parameters.app_client_id}}"
        databricks_host: "{{job.parameters.databricks_host}}"
        secrets_scope: "{{job.parameters.secrets_scope}}"
        client_id_key: "{{job.parameters.client_id_key}}"
        client_secret_key: "{{job.parameters.client_secret_key}}"

parameters:
  contract_id: ""
  ontos_base_url: ""
  pipeline_id: "dqx_contract_validation"
  write_quarantine: "true"
  auth_mode: "run_as"
  app_client_id: ""
  databricks_host: ""
  secrets_scope: ""
  client_id_key: "client_id"
  client_secret_key: "client_secret"

timeout_seconds: 1800
